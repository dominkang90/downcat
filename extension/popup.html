<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>받냥이</title>
  <style>
    body { font-family: system-ui, sans-serif; width: 320px; margin: 0; padding: 12px; color: #222; }
    h1 { font-size: 15px; margin: 0 0 8px; }
    #conn { font-weight: 600; margin: 6px 0; font-size: 13px; }
    button { padding: 7px 10px; margin-top: 6px; cursor: pointer; }
    .row { display: flex; gap: 6px; }
    .row button { flex: 1; }
    .hint { color: #666; font-size: 12px; margin-top: 8px; line-height: 1.4; }
    h2 { font-size: 13px; margin: 14px 0 4px; border-top: 1px solid #eee; padding-top: 10px; }
    #tools { display: flex; gap: 6px; align-items: center; margin-bottom: 4px; }
    #tools a { font-size: 12px; color: #2b7; cursor: pointer; }
    #list { max-height: 260px; overflow-y: auto; border: 1px solid #eee; border-radius: 4px; }
    .item { display: flex; align-items: center; gap: 6px; padding: 4px 6px; font-size: 12px; border-bottom: 1px solid #f3f3f3; }
    .item:last-child { border-bottom: none; }
    .item .k { flex: none; }
    .item .u { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; color: #444; }
    #send { width: 100%; background: #2b9ba3; color: #fff; border: none; border-radius: 4px; font-weight: 600; }
    #send:disabled { background: #bbb; }
    .empty { padding: 10px; color: #888; font-size: 12px; }
  </style>
</head>
<body>
  <h1>받냥이 다운로더</h1>
  <div id="conn">연결 확인 중…</div>
  <div class="row">
    <button id="page">이 페이지 보내기</button>
    <button id="opts">토큰 설정</button>
  </div>

  <h2>이 페이지의 미디어 (리소스 수집기)</h2>
  <div id="tools">
    <a id="all">전체선택</a> · <a id="none">해제</a> · <a id="refresh">새로고침</a>
  </div>
  <div id="list"><div class="empty">불러오는 중…</div></div>
  <button id="send" disabled>선택한 것 받냥이로 보내기</button>

  <div class="hint">동영상은 재생을 시작하면 스트림(m3u8 등)이 잡힙니다. 링크·미디어 우클릭 → "받냥이로 받기"도 됩니다.</div>
  <script src="popup.js"></script>
</body>
</html>
