<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>받냥이 확장 설정</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 460px; margin: 24px auto; padding: 0 16px; color: #222; }
    h1 { font-size: 18px; }
    label { display: block; margin: 14px 0 4px; font-weight: 600; }
    input[type=text] { width: 100%; padding: 8px; font-family: monospace; box-sizing: border-box; }
    button { margin-top: 12px; padding: 8px 14px; cursor: pointer; }
    .hint { color: #666; font-size: 13px; line-height: 1.5; }
    code { background: #f0f0f0; padding: 1px 5px; border-radius: 3px; }
    #status { margin-top: 12px; font-weight: 600; }
    ol { padding-left: 20px; line-height: 1.6; }
  </style>
</head>
<body>
  <h1>받냥이 확장 설정</h1>
  <p class="hint">받냥이가 발급한 <b>토큰</b>을 붙여넣어 짝을 맞춥니다. 토큰이 맞아야 다운로드가 전달됩니다.</p>

  <label for="token">브리지 토큰</label>
  <input id="token" type="text" placeholder="받냥이 config.json의 bridgeToken 값" autocomplete="off">
  <div>
    <button id="save">저장</button>
    <button id="test">연결 확인</button>
  </div>
  <div id="status"></div>

  <label>토큰은 어디서 찾나요?</label>
  <ol class="hint">
    <li>받냥이를 실행합니다.</li>
    <li>받냥이 폴더의 <code>config.json</code>을 열어 <code>"bridgeToken"</code> 값(긴 문자열)을 복사합니다.
      <br>PowerShell: <code>(Get-Content config.json -Raw | ConvertFrom-Json).bridgeToken</code></li>
    <li>여기에 붙여넣고 <b>저장</b> → <b>연결 확인</b>을 누릅니다.</li>
  </ol>

  <script src="options.js"></script>
</body>
</html>
