<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />
  <title>받냥이</title>
</head>
<body>
  <header>
    <h1>🐾 받냥이</h1>
    <p class="sub">URL 붙여넣고 다운로드. 영상·이미지 알아서 정리해서 받아요.</p>
  </header>

  <section class="input-row">
    <textarea id="url" rows="2" placeholder="여기에 링크 붙여넣기 · 여러 개면 줄바꿈으로 (유튜브 · 인스타 · imgur ...)" autofocus></textarea>
  </section>
  <section class="action-row">
    <select id="mode" title="받는 방식">
      <option value="auto">자동</option>
      <option value="video">영상</option>
      <option value="image">이미지</option>
    </select>
    <button id="go">다운로드</button>
  </section>

  <section class="folder-row">
    <span class="label">저장 폴더:</span>
    <span id="outdir" class="path">…</span>
    <button id="pick" class="ghost">변경</button>
    <button id="open" class="ghost">폴더 열기</button>
  </section>

  <section class="cookie-row">
    <label><input id="usecookie" type="checkbox" /> 로그인 쿠키 사용 (인스타 등)</label>
    <button id="pickcookie" class="ghost">쿠키 파일 선택</button>
    <span id="cookiename" class="path">없음</span>
    <span class="hint" title="크롬 확장앱 'Get cookies.txt LOCALLY'로 로그인 후 cookies.txt를 내보내 여기서 고르세요.">ⓘ</span>
  </section>

  <ul id="tasks"></ul>

  <script src="renderer.js"></script>
</body>
</html>
