<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />
  <title>받냥이</title>
</head>
<body>
  <header>
    <h1>🐾 받냥이</h1>
    <nav class="tabs">
      <button id="tab-dl" class="tab on">다운로드</button>
      <button id="tab-gallery" class="tab">갤러리</button>
    </nav>
  </header>

  <div id="dlview">
    <section class="input-row">
      <textarea id="url" rows="2" placeholder="여기에 링크 붙여넣기 · 여러 개면 줄바꿈으로 (유튜브 · 인스타 · imgur ...)" autofocus></textarea>
    </section>
    <section class="action-row">
      <select id="mode" title="받는 방식">
        <option value="auto">자동</option>
        <option value="video">영상</option>
        <option value="image">이미지</option>
      </select>
      <label class="chk"><input id="thumb" type="checkbox" /> 영상 썸네일도 저장</label>
      <button id="go">다운로드</button>
    </section>

    <section class="folder-row">
      <span class="label">저장 폴더:</span>
      <span id="outdir" class="path">…</span>
      <button id="pick" class="ghost">변경</button>
      <button id="open" class="ghost">폴더 열기</button>
    </section>

    <section class="cookie-row">
      <label class="chk"><input id="usecookie" type="checkbox" /> 로그인 쿠키 사용</label>
      <button id="instalogin" class="ghost">🔑 인스타 로그인</button>
      <span id="cookiename" class="path">없음</span>
    </section>

    <ul id="tasks"></ul>
  </div>

  <div id="galleryview" hidden>
    <div class="gallery-bar">
      <button id="refresh" class="ghost">새로고침</button>
      <span id="gallery-count" class="label"></span>
    </div>
    <div id="grid" class="grid"></div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
