<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />
  <title>받냥이</title>
</head>
<body>
  <div class="menubar">
    <span class="brand">🐾 받냥이</span>
    <button id="tab-dl" class="tab on">다운로드</button>
    <button id="tab-gallery" class="tab">갤러리</button>
    <span class="spacer"></span>
    <button id="opensettings" class="iconbtn" title="설정">⚙ 설정</button>
  </div>

  <div id="dlview">
    <div class="urlbar">
      <button id="play" class="play" title="받기">▶</button>
      <div class="pill">
        <span class="link">🔗</span>
        <textarea id="url" rows="1" placeholder="URL을 입력하세요 · 여러 개면 줄바꿈"></textarea>
      </div>
      <button id="go" class="download" title="받기">⬇</button>
    </div>

    <div class="optrow">
      <select id="mode" title="받는 방식">
        <option value="auto">자동</option>
        <option value="video">영상</option>
        <option value="image">이미지</option>
      </select>
      <label class="chk"><input id="thumb" type="checkbox" /> 영상 썸네일</label>
      <label class="chk"><input id="usecookie" type="checkbox" /> 로그인 쿠키</label>
      <button id="instalogin" class="loginbtn">🔑 로그인</button>
      <span id="cookiename" class="cookiename">없음</span>
    </div>

    <ul id="tasks" class="tasks"></ul>

    <div class="bottombar">
      <select id="sort" title="정렬">
        <option value="recent">최신순</option>
        <option value="title">제목순</option>
        <option value="site">사이트순</option>
        <option value="status">상태순</option>
      </select>
      <input id="filter" class="filter" placeholder="🔎 목록에서 검색" />
      <div class="labels" id="labels"></div>
      <span class="count" id="count"></span>
    </div>
  </div>

  <div id="galleryview" hidden>
    <div class="gallery-bar">
      <button id="refresh" class="iconbtn">새로고침</button>
      <span class="count" id="gallery-count"></span>
    </div>
    <div id="grid" class="grid"></div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
